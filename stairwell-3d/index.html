<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stair B – three floors</title>
<style>
  :root { color-scheme: dark; --fg:#e9e7e1; --dim:#a9a69c; --panel:rgba(20,20,22,.78); --line:rgba(255,255,255,.14); --accent:#f0b017; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#111; overflow:hidden; font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--fg); }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #ui { position:fixed; left:12px; top:12px; width:250px; max-width:calc(100vw - 24px); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; backdrop-filter:blur(6px); }
  #ui h1 { font-size:14px; margin:0 0 2px; letter-spacing:.02em; }
  #ui p { margin:0 0 10px; color:var(--dim); font-size:12px; }
  #ui h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:10px 0 5px; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:5px; }
  button { font:inherit; color:var(--fg); background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:6px; padding:5px 9px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.14); }
  button.on { background:var(--accent); color:#1a1400; border-color:var(--accent); font-weight:600; }
  label { display:flex; gap:7px; align-items:center; margin:3px 0; cursor:pointer; }
  #help { position:fixed; right:12px; bottom:12px; max-width:320px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:12px; color:var(--dim); }
  #help b { color:var(--fg); font-weight:600; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:#111; color:var(--dim); z-index:5; }
  #loading.hide { display:none; }
  #err { position:fixed; inset:0; display:none; place-items:center; background:#111; color:#f5b7b1; padding:24px; text-align:center; z-index:6; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Building the stairwell…</div>
<div id="err"></div>
<canvas id="c"></canvas>

<div id="ui">
  <h1>Stair B · Levels 1–3</h1>
  <p>Rebuilt from five reference photos: stair core only, nothing outside it.</p>
  <h2>Camera</h2>
  <div class="row">
    <button id="m-orbit" class="on">Orbit</button>
    <button id="m-walk">Walk</button>
  </div>
  <h2>Views</h2>
  <div class="row" id="views"></div>
  <h2>Go to level</h2>
  <div class="row" id="levels"></div>
  <h2>Show</h2>
  <label><input type="checkbox" id="t-cut" checked> Cut away walls facing the camera</label>
  <label><input type="checkbox" id="t-ceil" checked> Ceiling</label>
</div>
<div id="help"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

/* ------------------------------------------------------------------
   Dimensions (metres). x = west→east, z = north→south, y = up.
   The door and the riser cluster are on the north half of each landing;
   flight A (east, against the CMU wall) climbs southward, flight B
   (west, along the door wall) climbs back north to the next landing.
   ------------------------------------------------------------------ */
const H = 4.2;                 // floor to floor
const NR = 12;                 // risers per flight
const R = H / 2 / NR;          // 0.175
const T = 0.28;                // tread depth
const RUN = (NR - 1) * T;      // 3.08
const FW = 1.2;                // flight width
const GAP = 0.25;              // open well between flights
const W = 2 * FW + GAP;        // 2.65 inside width
const LD = 1.8;                // floor landing depth
const MD = 1.5;                // half-landing depth
const Z = LD + RUN + MD;       // inside length
const LEVELS = [0, H, 2 * H];
const CEIL = LEVELS[2] + 3.6;  // underside of the exposed deck above level 3
const SLAB = 0.28;

/* ------------------------------------------------------------------ renderer */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0f);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(65, 1, 0.05, 80);

/* ------------------------------------------------------------------ procedural textures */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeCanvas(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
function tex(c, rx = 1, ry = 1, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function speckle(ctx, w, h, rand, n, sz, palette, alpha) {
  for (let i = 0; i < n; i++) {
    ctx.globalAlpha = alpha * (0.4 + rand() * 0.6);
    ctx.fillStyle = palette[(rand() * palette.length) | 0];
    const s = 0.5 + rand() * sz; ctx.fillRect(rand() * w, rand() * h, s, s);
  }
  ctx.globalAlpha = 1;
}
function blotches(ctx, w, h, rand, n, rmin, rmax, color, alpha) {
  for (let i = 0; i < n; i++) {
    const x = rand() * w, y = rand() * h, r = rmin + rand() * (rmax - rmin);
    for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {
      const g = ctx.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      g.addColorStop(0, color.replace('A', alpha * (0.5 + rand() * 0.5))); g.addColorStop(1, color.replace('A', 0));
      ctx.fillStyle = g; ctx.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
    }
  }
}
function cracks(ctx, rand, n, w, h, alpha, width) {
  ctx.strokeStyle = `rgba(25,25,25,${alpha})`; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    let x = rand() * w, y = rand() * h; ctx.lineWidth = width * (0.5 + rand()); ctx.beginPath(); ctx.moveTo(x, y);
    const a0 = rand() * Math.PI * 2;
    for (let k = 0; k < 14; k++) { x += Math.cos(a0 + (rand() - 0.5) * 1.1) * 14; y += Math.sin(a0 + (rand() - 0.5) * 1.1) * 14; ctx.lineTo(x, y); }
    ctx.stroke();
  }
}

// 2 m concrete tiles
function concreteCanvas(base, spread, crackN) {
  return makeCanvas(512, 512, (ctx, w, h) => {
    const r = rng(11 + crackN);
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    blotches(ctx, w, h, r, 26, 40, 150, 'rgba(0,0,0,A)', 0.05);
    blotches(ctx, w, h, r, 22, 40, 130, 'rgba(255,255,255,A)', 0.04);
    speckle(ctx, w, h, r, 9000, 2.2, spread, 0.45);
    if (crackN) cracks(ctx, r, crackN, w, h, 0.55, 1.4);
  });
}
const TX = {};
TX.floor = tex(concreteCanvas('#6c6c6a', ['#4a4a49', '#858583', '#5b5b5a', '#909090'], 3), 0.5, 0.5);
TX.tread = tex(concreteCanvas('#9b9b97', ['#7c7c78', '#b1b1ad', '#8b8b87'], 0), 0.5, 0.5);
TX.slab = tex(concreteCanvas('#8d8d89', ['#6f6f6b', '#a5a5a0', '#7d7d79'], 0), 0.5, 0.5);

// CMU: 1.6 m x 0.8 m tile, 0.4 x 0.2 blocks, running bond
function cmuCanvases() {
  const W2 = 512, H2 = 256, bw = 128, bh = 64;
  const draw = (bump) => makeCanvas(W2, H2, (ctx, w, h) => {
    const r = rng(bump ? 5 : 7);
    ctx.fillStyle = bump ? '#dcdcdc' : '#ebe6d9'; ctx.fillRect(0, 0, w, h);
    for (let row = 0; row < 4; row++) {
      const off = (row % 2) * bw / 2;
      for (let c = -1; c < 5; c++) {
        const x = c * bw + off, y = row * bh;
        if (!bump) { const v = (r() - 0.5) * 8; ctx.fillStyle = `rgb(${235 + v},${230 + v},${217 + v})`; ctx.fillRect(x, y, bw, bh); }
      }
    }
    speckle(ctx, w, h, r, bump ? 14000 : 9000, 1.8, bump ? ['#999', '#ccc', '#eee'] : ['#d6d0c0', '#f5f1e6', '#cbc4b2'], bump ? 0.9 : 0.5);
    ctx.strokeStyle = bump ? '#222' : '#cfc8b6'; ctx.lineWidth = bump ? 5 : 3.5;
    for (let row = 0; row <= 4; row++) { ctx.beginPath(); ctx.moveTo(0, row * bh); ctx.lineTo(w, row * bh); ctx.stroke(); }
    for (let row = 0; row < 4; row++) {
      const off = (row % 2) * bw / 2;
      for (let c = -1; c < 5; c++) { const x = c * bw + off; ctx.beginPath(); ctx.moveTo(x, row * bh); ctx.lineTo(x, (row + 1) * bh); ctx.stroke(); }
    }
  });
  return [draw(false), draw(true)];
}
{ const [c, b] = cmuCanvases(); TX.cmu = tex(c, 1 / 1.6, 1 / 0.8); TX.cmuBump = tex(b, 1 / 1.6, 1 / 0.8, false); }

TX.paint = tex(makeCanvas(256, 256, (ctx, w, h) => {
  const r = rng(3); ctx.fillStyle = '#ece8dd'; ctx.fillRect(0, 0, w, h);
  speckle(ctx, w, h, r, 5000, 1.6, ['#e1ddd0', '#f6f3ea', '#d9d4c6'], 0.35);
}), 1 / 1.0, 1 / 1.0);

TX.spray = tex(makeCanvas(512, 512, (ctx, w, h) => {
  const r = rng(21); ctx.fillStyle = '#9a9a90'; ctx.fillRect(0, 0, w, h);
  blotches(ctx, w, h, r, 40, 20, 90, 'rgba(90,100,80,A)', 0.25);
  speckle(ctx, w, h, r, 26000, 3.4, ['#7d7d72', '#b7b5a8', '#6c7264', '#a8a698', '#c9c7ba'], 0.8);
}), 0.5, 0.5);

TX.wood = tex(makeCanvas(512, 1024, (ctx, w, h) => {
  const r = rng(9); ctx.fillStyle = '#d9b47c'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 520; i++) {
    const x = r() * w, y0 = r() * h, len = 120 + r() * 700, dark = r() < 0.5;
    ctx.strokeStyle = dark ? `rgba(120,80,40,${0.05 + r() * 0.12})` : `rgba(255,235,200,${0.05 + r() * 0.12})`;
    ctx.lineWidth = 0.6 + r() * 2.2; ctx.beginPath(); ctx.moveTo(x, y0);
    let xx = x; for (let k = 1; k <= 10; k++) { xx += (r() - 0.5) * 6; ctx.lineTo(xx, y0 + len * k / 10); } ctx.stroke();
  }
  for (const [cx, cy, sx, sy] of [[150, 380, 60, 320], [360, 700, 70, 360], [280, 120, 40, 200], [90, 860, 50, 240]]) {
    for (let k = 0; k < 9; k++) {
      ctx.strokeStyle = `rgba(150,105,60,${0.08 + k * 0.012})`; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(cx, cy, sx * (0.25 + k * 0.1), sy * (0.25 + k * 0.1), 0, 0, Math.PI * 2); ctx.stroke();
    }
  }
}), 1, 0.5);

TX.conduit = (() => { const t = tex(makeCanvas(16, 16, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#5d6165'); g.addColorStop(0.5, '#d8dcde'); g.addColorStop(1, '#5d6165');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}), 1, 1); return t; })();

TX.pipe = tex(makeCanvas(256, 256, (ctx, w, h) => {
  const r = rng(31); ctx.fillStyle = '#1b1c1e'; ctx.fillRect(0, 0, w, h);
  blotches(ctx, w, h, r, 14, 20, 70, 'rgba(255,255,255,A)', 0.05);
  speckle(ctx, w, h, r, 3000, 1.6, ['#2c2d30', '#101012', '#3a3b3e'], 0.6);
  cracks(ctx, r, 6, w, h, 0.12, 1);
}), 1, 1);

function signCanvas(level) {
  return makeCanvas(300, 460, (c, w, h) => {
    c.fillStyle = '#333436'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#f3f3f0'; c.textBaseline = 'alphabetic';
    c.font = '300 34px "Helvetica Neue",Arial,sans-serif'; c.fillText('STAIR B', 22, 62);
    c.font = '600 19px Arial,sans-serif'; c.fillText('LEVELS 1-4', 24, 88);
    c.font = '700 17px Arial,sans-serif'; c.fillText('LEVEL', 28, 132);
    c.font = '600 108px Arial,sans-serif'; c.fillText(String(level), 26, 232);
    c.font = '700 17px Arial,sans-serif';
    const lines = level === 1 ? ['↑ UP TO LEVEL 4 FOR', 'ROOF ACCESS', 'EXIT DISCHARGE']
      : level === 2 ? ['↓ DOWN TO LEVEL', '1 FOR DISCHARGE', 'ROOF ACCESS']
        : ['↑ UP TO LEVEL 4 FOR', 'ROOF ACCESS', '↓ DOWN TO LEVEL 1'];
    lines.forEach((t, i) => c.fillText(t, 26, 282 + i * 22));
    c.font = '700 14px Arial,sans-serif'; c.fillText('STAIR B', 26, 418); c.fillText('LEVEL ' + level, 178, 418);
  });
}
function labelCanvas(w, h, draw) { return makeCanvas(w, h, draw); }

/* ------------------------------------------------------------------ materials */
const std = (color, rough = 0.7, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
const M = {
  floor: std(0xffffff, 0.92, 0, { map: TX.floor }),
  tread: std(0xffffff, 0.9, 0, { map: TX.tread }),
  slab: std(0xffffff, 0.95, 0, { map: TX.slab }),
  cmu: std(0xffffff, 0.92, 0, { map: TX.cmu, bumpMap: TX.cmuBump, bumpScale: 2.2 }),
  paint: std(0xffffff, 0.88, 0, { map: TX.paint }),
  spray: std(0xffffff, 0.98, 0, { map: TX.spray, bumpMap: TX.spray, bumpScale: 3 }),
  yellow: std(0xf0b017, 0.5, 0.05),
  steel: std(0xc9cdd0, 0.32, 0.88),
  darkSteel: std(0x55585c, 0.45, 0.7),
  base: std(0x111112, 0.6),
  frame: std(0x5d564c, 0.5, 0.3),
  wood: std(0xffffff, 0.55, 0, { map: TX.wood }),
  pipe: std(0xffffff, 0.5, 0.35, { map: TX.pipe }),
  red: std(0xb3201a, 0.42, 0.1),
  orange: std(0xd8611b, 0.4, 0.1),
  brass: std(0xb58f3e, 0.34, 0.85),
  blue: std(0x1c3d78, 0.4, 0.1),
  silverBox: std(0xb6b9bb, 0.45, 0.7),
  firestop: std(0x8b8b86, 0.95),
  conduit: std(0xffffff, 0.35, 0.85, { map: TX.conduit }),
  white: std(0xf1f1ee, 0.6),
  lens: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xf4f9ff, emissiveIntensity: 2.2, roughness: 0.4 }),
  chalk: std(0xdad6ca, 0.9),
};

/* ------------------------------------------------------------------ geometry helpers */
function boxGeo(w, h, d, seed = 0) {
  const g = new THREE.BoxGeometry(w, h, d), p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  const r = rng(seed * 977 + 13), ou = r() * 4, ov = r() * 4;
  for (let i = 0; i < uv.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i));
    if (ax > 0.5) uv.setXY(i, p.getZ(i) + ou, p.getY(i) + ov);
    else if (ay > 0.5) uv.setXY(i, p.getX(i) + ou, p.getZ(i) + ov);
    else uv.setXY(i, p.getX(i) + ou, p.getY(i) + ov);
  }
  return g;
}
let seedCtr = 1;
function box(parent, mat, x0, y0, z0, x1, y1, z1) {
  const m = new THREE.Mesh(boxGeo(x1 - x0, y1 - y0, z1 - z0, seedCtr++), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); parent.add(m); return m;
}
const UP = new THREE.Vector3(0, 1, 0);
function cylBetween(parent, mat, a, b, r, seg = 12) {
  const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(dir, 0.5); m.quaternion.setFromUnitVectors(UP, dir.normalize()); parent.add(m); return m;
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function cylY(parent, mat, x, z, y0, y1, r, seg = 28) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, y1 - y0, seg), mat); m.position.set(x, (y0 + y1) / 2, z); parent.add(m); return m;
}
function sphere(parent, mat, x, y, z, r) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat); m.position.set(x, y, z); parent.add(m); return m; }
function plane(parent, mat, w, h, x, y, z, ry = 0) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m; }
function labelMat(canvas) { const t = new THREE.CanvasTexture(canvas); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return new THREE.MeshStandardMaterial({ map: t, roughness: 0.6, side: THREE.DoubleSide }); }

/* ------------------------------------------------------------------ groups */
const world = new THREE.Group(); scene.add(world);
const G = { struct: new THREE.Group(), stairs: new THREE.Group(), pipes: new THREE.Group(), ceiling: new THREE.Group() };
Object.values(G).forEach(g => world.add(g));
// each wall keeps its own dressing so it can be cut away as one
const WALLS = {
  west: { g: new THREE.Group(), n: V(-1, 0, 0), p: V(-0.2, 0, 0) },
  east: { g: new THREE.Group(), n: V(1, 0, 0), p: V(W + 0.2, 0, 0) },
  north: { g: new THREE.Group(), n: V(0, 0, -1), p: V(0, 0, -0.2) },
  south: { g: new THREE.Group(), n: V(0, 0, 1), p: V(0, 0, Z + 0.2) },
};
Object.values(WALLS).forEach(w => world.add(w.g));

/* ------------------------------------------------------------------ walls */
function wallMesh(mat, plane, a0, a1, y0, y1, thick, holes) {
  const s = new THREE.Shape();
  s.moveTo(a0, y0); s.lineTo(a1, y0); s.lineTo(a1, y1); s.lineTo(a0, y1); s.closePath();
  for (const h of holes || []) {
    const p = new THREE.Path(); p.moveTo(h[0], h[1]); p.lineTo(h[2], h[1]); p.lineTo(h[2], h[3]); p.lineTo(h[0], h[3]); p.closePath(); s.holes.push(p);
  }
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false }), mat);
  if (plane === 'west') { m.rotation.y = -Math.PI / 2; m.position.set(0, 0, 0); }
  if (plane === 'east') { m.rotation.y = -Math.PI / 2; m.position.set(W + thick, 0, 0); }
  if (plane === 'north') { m.position.set(0, 0, -thick); }
  if (plane === 'south') { m.position.set(0, 0, Z); }
  return m;
}
const Y0 = -0.5;
const DOOR = { z0: 0.35, z1: 1.35, h: 2.1 };
WALLS.west.g.add(wallMesh(M.paint, 'west', -0.2, Z + 0.2, Y0, CEIL, 0.2,
  LEVELS.map(L => [DOOR.z0, L, DOOR.z1, L + DOOR.h])));
WALLS.east.g.add(wallMesh(M.cmu, 'east', -0.2, Z + 0.2, Y0, CEIL, 0.2));
WALLS.north.g.add(wallMesh(M.paint, 'north', -0.2, W + 0.2, Y0, CEIL, 0.2));
WALLS.south.g.add(wallMesh(M.paint, 'south', -0.2, W + 0.2, Y0, CEIL, 0.2));
// the north/south walls are painted block too; tone them with the same paint

/* ------------------------------------------------------------------ floor slabs */
box(G.struct, M.floor, -0.2, Y0, -0.2, W + 0.2, 0, Z + 0.2);                                 // ground slab, level 1
for (const L of [LEVELS[1], LEVELS[2]]) box(G.struct, M.floor, 0, L - SLAB, 0, W, L, LD);       // floor landings
for (const y of [H / 2, H * 1.5]) box(G.struct, M.floor, 0, y - SLAB, LD + RUN, W, y, Z);       // half landings
// black rubber base
function baseboard(wall, x0, z0, x1, z1, y) {
  const t = 0.012, h = 0.1;
  const xa = Math.min(x0, x1), xb = Math.max(x0, x1), za = Math.min(z0, z1), zb = Math.max(z0, z1);
  box(WALLS[wall].g, M.base, xa - (wall === 'east' ? t : 0), y, za - (wall === 'north' ? t : 0), xb + (wall === 'west' ? t : 0), y + h, zb + (wall === 'south' ? t : 0));
}
for (const L of LEVELS) {
  baseboard('north', 0, 0, W, 0, L);
  baseboard('east', W, 0, W, LD, L);
  baseboard('west', 0, 0, 0, DOOR.z0, L);
  baseboard('west', 0, DOOR.z1, 0, LD, L);
}
baseboard('east', W, LD, W, Z, 0); baseboard('west', 0, LD, 0, Z, 0); baseboard('south', 0, Z, W, Z, 0);
for (const y of [H / 2, H * 1.5]) { baseboard('south', 0, Z, W, Z, y); baseboard('east', W, LD + RUN, W, Z, y); baseboard('west', 0, LD + RUN, 0, Z, y); }

/* ------------------------------------------------------------------ doors */
function buildDoor(level, L) {

/* ------------------------------------------------------------------ walkable surfaces */
function surfaces(x, z) {
  const s = [0];
  if (z < LD) s.push(H, 2 * H);
  if (z > LD + RUN) s.push(H / 2, H * 1.5);
  if (z >= LD && z <= LD + RUN) {
    for (const st of [0, 1]) {
      if (x >= W - FW) { const k = Math.min(NR - 2, Math.floor((z - LD) / T)); s.push(st * H + (k + 1) * R); }
      if (x <= FW) { const k = Math.min(NR - 2, Math.floor((LD + RUN - z) / T)); s.push(st * H + H / 2 + (k + 1) * R); }
    }
  }
  return s;
}
const solids = [ // circles the walker cannot enter
  [BIG.x, BIG.z, BIG.r + 0.2], [MED.x, MED.z, 0.32], [TST.x, TST.z, 0.2], [THIN.x, THIN.z, THIN.r + 0.2],
];
const RADIUS = 0.2;
function blocked(x, z, y) {
  if (x < 0.25 || x > W - 0.25 || z < 0.25 || z > Z - 0.25) return true;
  if (z > LD - 0.12 && z < LD + RUN + 0.05 && x > FW - 0.22 && x < W - FW + 0.22) return true;          // open well + guards
  for (const [cx, cz, r] of solids) if (Math.hypot(x - cx, z - cz) < r) return true;
  const sf = surfaces(x, z); let sup = -1e9;
  for (const v of sf) if (v <= y + 0.4 && v > sup) sup = v;
  for (const v of sf) if (v > sup + 0.05 && v < sup + 2.0) return true;     // no head room
  return false;
}
function supportY(x, z, y) { let sup = 0; for (const v of surfaces(x, z)) if (v <= y + 0.4 && v > sup) sup = v; return sup; }

/* ------------------------------------------------------------------ camera modes */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxDistance = 30; controls.minDistance = 0.5;
const player = { x: 1.2, z: 1.2, y: LEVELS[1], yaw: 0, pitch: 0 };
let mode = 'orbit';
const EYE = 1.62;

function setMode(m) {
  mode = m;
  document.getElementById('m-orbit').classList.toggle('on', m === 'orbit');
  document.getElementById('m-walk').classList.toggle('on', m === 'walk');
  controls.enabled = m === 'orbit';
  camera.fov = m === 'walk' ? 72 : 55; camera.updateProjectionMatrix();
  if (m === 'walk') { camera.position.set(player.x, player.y + EYE, player.z); }
  updateHelp();
}
function orbitTo(pos, target) { setMode('orbit'); camera.position.copy(pos); controls.target.copy(target); controls.update(); }
function walkTo(x, z, level, yaw, pitch = 0) {
  player.x = x; player.z = z; player.y = LEVELS[level - 1]; player.yaw = yaw; player.pitch = pitch; setMode('walk');
}
const VIEWS = {
  'Overview': () => orbitTo(V(-10.5, 14.5, 13.5), V(1.3, 5.6, 2.9)),
  'Riser corner': () => walkTo(0.9, 1.55, 2, Math.atan2(-(W - 0.2 - 0.9), -(0.4 - 1.55)), 0.06),
  'Door + sign': () => walkTo(2.35, 1.0, 2, Math.PI / 2, 0),
  'Stair flights': () => walkTo(1.75, 1.15, 2, Math.PI + 0.12, 0.22),
  'Looking up': () => walkTo(1.3, 1.2, 3, Math.atan2(-(W - 0.5 - 1.3), -(0.3 - 1.2)), 1.05),
};
const viewsEl = document.getElementById('views');
for (const [name, fn] of Object.entries(VIEWS)) { const b = document.createElement('button'); b.textContent = name; b.onclick = fn; viewsEl.appendChild(b); }
const lvEl = document.getElementById('levels');
[1, 2, 3].forEach(n => { const b = document.createElement('button'); b.textContent = 'Level ' + n; b.onclick = () => walkTo(1.5, 1.2, n, Math.atan2(-(W - 0.2 - 1.5), -(0.4 - 1.2)), 0.05); lvEl.appendChild(b); });
document.getElementById('m-orbit').onclick = () => { if (mode !== 'orbit') { const p = camera.position.clone(); const d = new THREE.Vector3(); camera.getWorldDirection(d); orbitTo(p, p.clone().addScaledVector(d, 3)); } };
document.getElementById('m-walk').onclick = () => { if (mode !== 'walk') VIEWS['Riser corner'](); };
function updateHelp() {
  document.getElementById('help').innerHTML = mode === 'walk'
    ? '<b>Walk</b>: W A S D / arrows to move (Shift = run), drag to look. Stairs are climbable.'
    : '<b>Orbit</b>: drag to rotate, wheel to zoom, right-drag to pan. Try <b>Walk</b> or a view preset.';
}

const keys = new Set();
addEventListener('keydown', e => { keys.add(e.code); });
addEventListener('keyup', e => keys.delete(e.code));
let drag = null;
canvas.addEventListener('pointerdown', e => { if (mode === 'walk') { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); } });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  player.yaw -= (e.clientX - drag.x) * 0.004; player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - (e.clientY - drag.y) * 0.004));
  drag.x = e.clientX; drag.y = e.clientY;
});
canvas.addEventListener('pointerup', () => { drag = null; });

let wantCut = true, wantCeil = true;
document.getElementById('t-cut').onchange = e => { wantCut = e.target.checked; };
document.getElementById('t-ceil').onchange = e => { wantCeil = e.target.checked; };

function stepWalk(dt) {
  const f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  const s = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  const turn = (keys.has('ArrowLeft') ? 1 : 0) - (keys.has('ArrowRight') ? 1 : 0);
  player.yaw += turn * dt * 1.8;
  if (f || s) {
    const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 3.2 : 1.6) * dt;
    const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw), rx = -fz, rz = fx;
    const dx = (fx * f + rx * s) * sp, dz = (fz * f + rz * s) * sp;
    if (!blocked(player.x + dx, player.z, player.y)) player.x += dx;
    if (!blocked(player.x, player.z + dz, player.y)) player.z += dz;
  }
  const target = supportY(player.x, player.z, player.y);
  player.y += (target - player.y) * Math.min(1, dt * 10);
  camera.position.set(player.x, player.y + EYE, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

const cutTmp = new THREE.Vector3();
function updateCutaway() {
  const outside = (w) => cutTmp.subVectors(camera.position, w.p).dot(w.n) > 0;
  for (const w of Object.values(WALLS)) w.g.visible = mode === 'walk' || !wantCut || !outside(w);
  G.ceiling.visible = wantCeil && (mode === 'walk' || camera.position.y < CEIL);
}

/* ------------------------------------------------------------------ loop */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'walk') stepWalk(dt); else controls.update();
  updateCutaway();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
VIEWS['Overview']();
document.getElementById('loading').classList.add('hide');
requestAnimationFrame(frame);
window.stairwell = { surfaces, blocked, supportY, VIEWS, walkTo, orbitTo, camera, player, THREE, scene, setMode, get mode() { return mode; } };
